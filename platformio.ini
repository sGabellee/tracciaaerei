[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; La Super Mini usa la USB nativa del chip per seriale/flash (nessun chip USB-UART a bordo)

; Confermato sul progetto di test (tracciaaerei-hwtest): questa scheda ha
; 4MB di flash reale, non gli 8MB assunti dalla board generica
; esp32-s3-devkitc-1 — senza questo la tabella partizioni non corrisponde
; e causa un crash di avvio (assert do_core_init / core dump corrotto).
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; PSRAM per la vista Mappa (cache delle tile decodificate, ~1.5 MB). La Super
; Mini col chip ESP32-S3FH4R2 ha 2MB di PSRAM quad (qio_qspi). Se la tua non
; ce l'ha il firmware parte lo stesso e la vista Mappa resta disattivata
; (log seriale: "[map] PSRAM non trovata").
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    lovyan03/LovyanGFX@^1.1.16
